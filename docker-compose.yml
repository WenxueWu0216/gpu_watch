# Local GPUWatch stack on the SIMULATOR (no GPU needed): `docker compose up --build`.
#   Grafana     http://localhost:3000  (anonymous viewer; admin/admin)
#   Prometheus  http://localhost:9090
#   Exporter    http://localhost:9400/metrics
#   Simulator   http://localhost:9500/snapshot  (POST /inject to add faults)
#   Tempo       http://localhost:3200
services:
  gpu-sim:
    build: .
    command: ["gpu_sim", "serve", "--port", "9500", "--speed", "1", "--seed", "1"]
    ports: ["9500:9500"]

  exporter:
    build: ./exporter
    command: ["--mode=sim", "--listen=:9400", "--sim-url=http://gpu-sim:9500/snapshot"]
    ports: ["9400:9400"]
    depends_on: [gpu-sim]

  detector:
    build: .
    command: ["detector", "--source", "prometheus", "--prom-url", "http://prometheus:9090",
              "--interval", "10", "--otlp-endpoint", "http://otel-collector:4318"]
    depends_on: [prometheus, otel-collector]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/compose/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./deploy/compose/tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["3200:3200"]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes:
      - ./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./dashboards/alerts:/etc/prometheus/rules:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cluster-overview.json
    volumes:
      - ./deploy/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/grafana:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo]
