global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/rules/*.yaml
scrape_configs:
  - job_name: gpuwatch-exporter
    static_configs: [{targets: ["exporter:9400"]}]
  - job_name: otel-collector
    # detector / bring-up metrics arrive via OTLP and are re-exposed here
    static_configs: [{targets: ["otel-collector:8889"]}]
