# Evaluation protocol for `make eval`. Changing anything here changes the
# numbers in docs/results.md and README.md (both regenerated by `make eval`).
#
# Seeds: evaluation uses seeds [seed_base, seed_base + runs). Detector
# thresholds were tuned on a disjoint seed range (>= 1000) so the evaluation
# is not scored on the data it was tuned on.
seed_base: 0
runs_per_fault: 100
healthy_runs: 200
duration_s: 1800
fault_start_window_s: [300, 900]
nodes: 8
gpus_per_node: 8
