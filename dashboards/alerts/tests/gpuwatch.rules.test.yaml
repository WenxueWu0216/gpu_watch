# promtool test rules dashboards/alerts/tests/gpuwatch.rules.test.yaml
rule_files:
  - ../gpuwatch.rules.yaml
evaluation_interval: 10s
tests:
  - interval: 10s
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{Hostname="n1",gpu="3"}'
        values: '0 0 79 79 79'
      - series: 'DCGM_FI_DEV_XID_ERRORS{Hostname="n2",gpu="0"}'
        values: '0 13 13 13 13 13 13 13 13 13'
    alert_rule_test:
      - eval_time: 30s
        alertname: GPUXidCritical
        exp_alerts:
          - exp_labels: {severity: critical, runbook: runbook.md#1-xid-errors, Hostname: n1, gpu: "3"}
            exp_annotations:
              summary: "XID 79 on n1 GPU 3"
              description: "Hardware/driver XID. Drain the node and follow the XID runbook."
      - eval_time: 30s
        alertname: GPUXidOther
        exp_alerts: []
      - eval_time: 80s
        alertname: GPUXidOther
        exp_alerts:
          - exp_labels: {severity: warning, runbook: runbook.md#1-xid-errors, Hostname: n2, gpu: "0"}
            exp_annotations:
              summary: "XID 13 on n2 GPU 0 (often application-triggered)"

  - interval: 10s
    input_series:
      # 0x20 SW_THERMAL from t=10s; 0x4 SW_POWER_CAP alone must not fire.
      - series: 'DCGM_FI_DEV_CLOCK_THROTTLE_REASONS{Hostname="n1",gpu="1"}'
        values: '0 32 32 32 32 32 32 96 96'
      - series: 'DCGM_FI_DEV_CLOCK_THROTTLE_REASONS{Hostname="n1",gpu="2"}'
        values: '4 4 4 4 4 4 4 4 4'
    alert_rule_test:
      - eval_time: 20s
        alertname: GPUThermalThrottle
        exp_alerts: []
      - eval_time: 60s
        alertname: GPUThermalThrottle
        exp_alerts:
          - exp_labels: {severity: warning, runbook: runbook.md#3-thermal-throttle, Hostname: n1, gpu: "1"}
            exp_annotations:
              summary: "Thermal throttling on n1 GPU 1"

  - interval: 10s
    input_series:
      - series: 'DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{Hostname="n1",gpu="4"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 50s
        alertname: GPUEccUncorrectable
        exp_alerts:
          - exp_labels: {severity: critical, runbook: runbook.md#2-ecc-errors, Hostname: n1, gpu: "4"}
            exp_annotations:
              summary: "Uncorrectable ECC errors on n1 GPU 4"

  - interval: 10s
    input_series:
      - series: 'gpuwatch_train_step_time_seconds{Hostname="a",rank="0"}'
        values: '0.5x40'
      - series: 'gpuwatch_train_step_time_seconds{Hostname="b",rank="8"}'
        values: '0.5x40'
      - series: 'gpuwatch_train_step_time_seconds{Hostname="c",rank="16"}'
        values: '0.65x40'
    alert_rule_test:
      - eval_time: 300s
        alertname: NodeStraggler
        exp_alerts:
          - exp_labels: {severity: warning, runbook: runbook.md#4-straggler-node, Hostname: c}
            exp_annotations:
              summary: "c step time 130% of cluster median"
